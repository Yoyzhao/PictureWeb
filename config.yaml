ANONYMOUS_ACCESS: true
CACHE_DIR: data/cache
DB_PATH: data/db/database.db
ENABLE_PRELOAD: true
HOTKEYS:
  CLOSE: Escape
  DELETE: Delete
  FAVORITE: f
  NEXT: ArrowRight
  PREV: ArrowLeft
  RESET: h
  ROTATE: r
  ZOOM_IN: ArrowUp
  ZOOM_OUT: ArrowDown
LOG_LEVEL: WARNING
SCAN_EXTENSIONS: .jpg,.jpeg,.png,.gif,.bmp,.webp,.tiff
SCAN_RECURSIVE: true
SERVER_PORT: 5001
THUMBNAIL_QUALITY: 90
THUMBNAIL_PREGENERATE: true
TRASH_DIR: data/trash
