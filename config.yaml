ANONYMOUS_ACCESS: true
CACHE_DIR: data/cache
DB_PATH: data/db/database.db
ENABLE_PRELOAD: true
HOTKEYS:
  CLOSE: Escape
  DELETE: Delete
  FAVORITE: f
  NEXT: ArrowRight
  PREV: ArrowLeft
  RESET: h
  ROTATE: r
  ZOOM_IN: ArrowUp
  ZOOM_OUT: ArrowDown
LOG_LEVEL: WARNING
SCAN_EXTENSIONS: .jpg,.jpeg,.png,.gif,.bmp,.webp,.tiff
SCAN_VIDEO_EXTENSIONS: .mp4,.m4v,.webm,.mov,.mkv,.avi,.wmv,.flv
SCAN_RECURSIVE: true
SERVER_PORT: 5001
THUMBNAIL_FORMAT: webp
THUMBNAIL_QUALITY: 90
THUMBNAIL_PREGENERATE: true
VIDEO_THUMBNAIL_PREGENERATE: true
VIDEO_THUMBNAIL_TIMEOUT: 20
VIDEO_PROBE_TIMEOUT: 10
FFMPEG_PATH: D:/FFmpeg/ffmpeg.exe
FFPROBE_PATH: D:/FFmpeg/ffprobe.exe
TRASH_DIR: data/trash
