# PicGallery 开发/测试配置示例
# 复制为 config.yaml 后按本机环境调整；生产环境使用部署副本中的独立 config.yaml。
# 密钥与管理员初始账号不在此处配置，见 .env.example。

SERVER_PORT: 5001               # 后端服务端口（开发）
DB_PATH: "data/db/database.db"  # 测试数据库路径
CACHE_DIR: "data/cache"         # 缩略图缓存目录
TRASH_DIR: "data/trash"         # 应用内回收站目录
LOG_LEVEL: "INFO"               # 日志级别 (DEBUG, INFO, ERROR)
ANONYMOUS_ACCESS: true          # 是否允许匿名访问公开文件夹
THUMBNAIL_FORMAT: "webp"        # 缩略图格式 (webp/jpeg)，存量 jpg 缓存仍可读取
THUMBNAIL_QUALITY: 90           # 缩略图质量 (1-100)
THUMBNAIL_PREGENERATE: true     # 扫描完成后后台预生成小尺寸缩略图
SCAN_RECURSIVE: true            # 是否递归扫描文件夹
SCAN_EXTENSIONS: ".jpg,.jpeg,.png,.gif,.bmp,.webp,.tiff" # 扫描的图片后缀名
SCAN_VIDEO_EXTENSIONS: ".mp4,.m4v,.webm,.mov,.mkv,.avi,.wmv,.flv" # 扫描的视频后缀名
FFMPEG_PATH: "ffmpeg"           # 视频封面抽帧；Windows 服务环境建议写绝对路径，如 "D:/FFmpeg/ffmpeg.exe"
FFPROBE_PATH: "ffprobe"         # 视频元数据探测；建议与 FFMPEG_PATH 同目录
VIDEO_THUMBNAIL_PREGENERATE: true  # 扫描完成后后台低并发预生成视频封面
VIDEO_THUMBNAIL_TIMEOUT: 20     # 单个视频抽帧子进程超时（秒）
VIDEO_PROBE_TIMEOUT: 10         # 单个视频元数据探测超时（秒）
ENABLE_PRELOAD: true            # Lightbox 原图预加载

# 快捷键设置
HOTKEYS:
  PREV: "ArrowLeft"      # 上一张
  NEXT: "ArrowRight"     # 下一张
  CLOSE: "Escape"        # 关闭视图
  FAVORITE: "f"          # 收藏/取消收藏
  DELETE: "Delete"       # 删除图片
  ROTATE: "r"            # 旋转图片
  ZOOM_IN: "ArrowUp"     # 放大
  ZOOM_OUT: "ArrowDown"  # 缩小
  RESET: "h"             # 重置视图
